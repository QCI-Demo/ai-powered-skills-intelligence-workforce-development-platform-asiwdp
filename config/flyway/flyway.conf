# Flyway configuration for ASIWDP Skills Framework PostgreSQL schema.
# Supply JDBC credentials via CLI flags or environment — do not commit secrets.
#
# Example:
#   flyway -configFiles=config/flyway/flyway.conf \
#     -url=jdbc:postgresql://localhost:5432/asiwdp_skills \
#     -user="$ASIWDP_DB_USER" -password="$ASIWDP_DB_PASSWORD" migrate
#
# Undo (down) SQL lives in db/postgres/undo/ and is applied manually
# (or via Liquibase rollback) because Flyway OSS does not ship undo migrations.

flyway.locations=filesystem:db/postgres/sql
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.encoding=UTF-8
