openapi: 3.0.3
info:
  title: ASIWDP Feedback Service
  version: 1.0.0
  description: |
    Learner feedback ingestion and persistence APIs for the AI-Powered Skills
    Intelligence & Workforce Development Platform. Protected by OAuth2/JWT
    tenant-scoped RBAC.

    Records accept/reject actions and optional ratings linked to recommendation
    records. Feedback data supports model retraining and recommendation
    improvement.
servers:
  - url: /api/v1
tags:
  - name: Feedback
    description: Learner feedback operations
  - name: Health
    description: Service health checks
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: feedback-service

  /feedback:
    post:
      tags: [Feedback]
      summary: Submit learner feedback on a recommendation
      description: |
        Records accept/reject feedback and optional rating for a recommendation.
        Requires `recommendations:read` scope (learner role).

        Response includes model version metadata and timestamps for
        explainability and audit trails.
      security:
        - OAuth2Bearer: [recommendations:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackCreate"
      responses:
        "201":
          description: Feedback recorded successfully
          headers:
            X-Model-Version:
              description: Version of the recommendation model
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [Feedback]
      summary: List feedback entries
      description: |
        Retrieves feedback entries with optional filters. Results are
        tenant-scoped. Requires `recommendations:read` scope.
      security:
        - OAuth2Bearer: [recommendations:read]
      parameters:
        - name: recommendation_id
          in: query
          description: Filter by recommendation ID
          schema:
            type: string
            format: uuid
        - name: learner_id
          in: query
          description: Filter by learner ID
          schema:
            type: string
            format: uuid
        - name: feedback_type
          in: query
          description: Filter by feedback type
          schema:
            type: string
            enum: [accept, reject]
        - name: limit
          in: query
          description: Maximum results to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: Pagination offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of feedback entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /feedback/{feedbackId}:
    get:
      tags: [Feedback]
      summary: Retrieve specific feedback entry
      description: |
        Retrieves a single feedback entry by ID. Tenant-scoped.
        Requires `recommendations:read` scope.
      security:
        - OAuth2Bearer: [recommendations:read]
      parameters:
        - name: feedbackId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Feedback details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          description: Invalid feedback ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token with tenant_id, roles, and scopes. See
        docs/design/jwt-claim-schema-and-rbac.md.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.asiwdp.example/oauth/token
          scopes:
            recommendations:read: Read recommendations and submit feedback
            recommendations:generate: Generate recommendations
            recommendations:admin: Administer recommendation engine

  responses:
    Unauthorized:
      description: Missing, expired, or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: RBAC denial for tenant-scoped permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    FeedbackCreate:
      type: object
      required:
        - recommendation_id
        - feedback_type
      properties:
        recommendation_id:
          type: string
          format: uuid
          description: ID of the recommendation being reviewed
        feedback_type:
          type: string
          enum: [accept, reject]
          description: Whether learner accepted or rejected the recommendation
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Optional rating from 1 to 5
        comment:
          type: string
          maxLength: 2000
          nullable: true
          description: Optional learner comment
      example:
        recommendation_id: "123e4567-e89b-12d3-a456-426614174000"
        feedback_type: accept
        rating: 5
        comment: "Great recommendation!"

    FeedbackResponse:
      type: object
      required:
        - id
        - tenant_id
        - learner_id
        - recommendation_id
        - feedback_type
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique feedback identifier
        tenant_id:
          type: string
          format: uuid
          description: Tenant scope (foreign key)
        learner_id:
          type: string
          format: uuid
          description: Learner user ID (foreign key)
        recommendation_id:
          type: string
          format: uuid
          description: Recommendation ID (foreign key to recommendation record)
        feedback_type:
          type: string
          enum: [accept, reject]
          description: Accept or reject action
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Optional 1-5 rating
        comment:
          type: string
          nullable: true
          description: Optional comment
        created_at:
          type: string
          format: date-time
          description: Timestamp of submission
        model_version:
          type: string
          nullable: true
          description: Version of the recommendation model
      example:
        id: "987fcdeb-51a2-43e7-b8c9-012345678901"
        tenant_id: "abc12345-6789-0def-ghij-klmnopqrstuv"
        learner_id: "user1234-5678-90ab-cdef-ghijklmnopqr"
        recommendation_id: "123e4567-e89b-12d3-a456-426614174000"
        feedback_type: accept
        rating: 5
        comment: "Great recommendation!"
        created_at: "2024-01-15T10:30:00Z"
        model_version: "v1.2.0"

    FeedbackList:
      type: object
      required:
        - items
        - total
        - limit
        - offset
        - timestamp
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackResponse"
        total:
          type: integer
          description: Total count of feedback entries for tenant
        limit:
          type: integer
          description: Maximum results returned
        offset:
          type: integer
          description: Pagination offset used
        timestamp:
          type: string
          format: date-time
          description: Response generation timestamp

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
      example:
        error: validation_error
        message: "recommendation_id is required"

security:
  - OAuth2Bearer: []
