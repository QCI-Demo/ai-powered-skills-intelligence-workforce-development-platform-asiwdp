openapi: 3.0.3
info:
  title: ASIWDP Recommendation Engine Service
  version: 1.0.0
  description: |
    AI recommendation APIs. Protected by OAuth2/JWT tenant-scoped RBAC.
    Required scopes documented per operation.

    Model-serving containers (recommendation ranking, career forecast, adaptive
    sequencing) additionally expose versioned `/api/v1/predict` endpoints that
    always return `rationale` and `model_metadata` for explainability.
servers:
  - url: /api/v1
tags:
  - name: Recommendations
  - name: ModelServing
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is healthy
  /recommendations:
    get:
      tags: [Recommendations]
      summary: List recommendations for the caller
      description: Requires `recommendations:read`.
      security:
        - OAuth2Bearer: [recommendations:read]
      responses:
        "200":
          description: Recommendation list
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recommendations/generate:
    post:
      tags: [Recommendations]
      summary: Generate personalized recommendations
      description: Requires `recommendations:generate`.
      security:
        - OAuth2Bearer: [recommendations:generate]
      responses:
        "202":
          description: Generation accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recommendations/admin/reindex:
    post:
      tags: [Recommendations]
      summary: Rebuild recommendation indexes
      description: Requires `recommendations:admin` (tenant_admin or platform_admin).
      security:
        - OAuth2Bearer: [recommendations:admin]
      responses:
        "202":
          description: Reindex accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /predict:
    post:
      tags: [ModelServing]
      summary: Score candidates / forecast roles / sequence modules
      description: |
        Versioned model-serving endpoint used by the MLflow-packaged containers.
        Response always includes per-item and summary `rationale` strings plus
        `model_metadata` (name, version, stage, framework, metrics).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRequest"
      responses:
        "200":
          description: Ranked predictions with rationale and model metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictResponse"
components:
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token with tenant_id, roles, and scopes. See
        docs/design/jwt-claim-schema-and-rbac.md.
    OAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.asiwdp.example/oauth/token
          scopes:
            recommendations:read: Read recommendations
            recommendations:generate: Generate recommendations
            recommendations:admin: Administer recommendation engine
  responses:
    Unauthorized:
      description: Missing, expired, or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: RBAC denial for tenant-scoped permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    PredictRequest:
      type: object
      properties:
        learner_id:
          type: string
        tenant_id:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Recommendation ranking candidates (skill-gap + content features)
        features:
          type: object
          additionalProperties: true
          description: Career-forecast temporal feature vector
        modules:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Adaptive sequencing module candidates
    ModelMetadata:
      type: object
      required: [model_name, model_version, framework, trained_at]
      properties:
        model_name:
          type: string
        model_version:
          type: string
        mlflow_run_id:
          type: string
          nullable: true
        stage:
          type: string
        trained_at:
          type: string
          format: date-time
        framework:
          type: string
        metrics:
          type: object
          additionalProperties:
            type: number
        feature_schema_version:
          type: string
    PredictResponse:
      type: object
      required: [predictions, rationale, model_metadata]
      properties:
        predictions:
          type: array
          items:
            type: object
            additionalProperties: true
        rationale:
          type: string
          description: Human-readable summary explanation
        model_metadata:
          $ref: "#/components/schemas/ModelMetadata"
security:
  - OAuth2Bearer: []
