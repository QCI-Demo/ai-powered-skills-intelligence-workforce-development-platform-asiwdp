[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    integration: marks tests as integration tests (may require running API)
    performance: marks tests as performance tests (deselect by default)
    slow: marks tests as slow-running

addopts = 
    -v
    --tb=short
    --strict-markers

filterwarnings =
    ignore::DeprecationWarning

# JUnit XML output for CI
junit_family = xunit2
