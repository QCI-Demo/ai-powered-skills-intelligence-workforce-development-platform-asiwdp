# Production overrides for ASIWDP RabbitMQ webhook delivery queue
replicaCount: 3

image:
  pullPolicy: IfNotPresent
  tag: "3.13.2-management-alpine"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: true
  size: 50Gi
  storageClass: gp3

auth:
  createSecret: false
  existingSecret: "asiwdp-rabbitmq-auth-prod"

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

config:
  memoryHighWatermark: "0.5"
  consumerTimeoutMs: 1800000
  clusterPartitionHandling: pause_minority

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: rabbitmq
        topologyKey: kubernetes.io/hostname

asiwdp:
  environment: prod
  vhost: asiwdp
  webhook:
    maxDeliveryAttempts: 5
    # Longer base delay supports exponential back-off up to attempt 5.
    retryDelayMs: 10000
    messageTtlMs: 172800000
