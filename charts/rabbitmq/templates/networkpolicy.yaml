{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rabbitmq.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # AMQP — webhook-service workers only
    - from:
        {{- toYaml .Values.networkPolicy.allowedClientNamespaces | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.amqpPort }}
    # Management / metrics — observability namespaces
    - from:
        {{- toYaml .Values.networkPolicy.allowedObservabilityNamespaces | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
        - protocol: TCP
          port: {{ .Values.service.metricsPort }}
    # Intra-cluster clustering
    - from:
        - podSelector:
            matchLabels:
              {{- include "rabbitmq.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4369
        - protocol: TCP
          port: 25672
{{- end }}
