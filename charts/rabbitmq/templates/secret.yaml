{{- /*
  Broker credentials are expected to be supplied via an existing Secret
  (created out-of-band or by an external secrets operator). This template
  only creates a Secret when auth.existingSecret is empty AND
  auth.createSecret is true — intended for local/dev bootstrap only.
  Never commit real passwords; leave password empty so Helm fails closed
  unless an existingSecret is referenced.
*/ -}}
{{- if and .Values.auth.createSecret (empty .Values.auth.existingSecret) }}
{{- if empty .Values.auth.password }}
{{- fail "charts/rabbitmq: set auth.existingSecret or provide auth.password via --set / sealed values (never commit secrets)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rabbitmq.fullname" . }}-auth
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  erlangCookie: {{ required "auth.erlangCookie is required when createSecret=true" .Values.auth.erlangCookie | quote }}
{{- end }}
