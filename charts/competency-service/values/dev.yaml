# Development overrides for competency-service
replicaCount: 1

image:
  pullPolicy: Always
  tag: "dev"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  hosts:
    - host: competency.dev.asiwdp.local
      paths:
        - path: /api/v1
          pathType: Prefix

tenant:
  isolationEnabled: true
  defaultTenantId: "dev-tenant"
  cacheMaxTenants: 100
  cacheTtlSeconds: 60

config:
  logLevel: debug
  latencyBudgetMs: 50
  taxonomy:
    versioningEnabled: true
    allowBulkImport: true
    maxBulkRecords: 1000
  audit:
    enabled: true
    retentionDays: 30
  database:
    host: postgres.dev.svc.cluster.local
    port: 5432
    name: competency_dev
    sslMode: disable
  redis:
    enabled: true
    host: redis.dev.svc.cluster.local
    port: 6379
    db: 0
