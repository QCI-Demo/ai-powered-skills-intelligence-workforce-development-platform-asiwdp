# Production overrides for competency-service
replicaCount: 3

image:
  pullPolicy: IfNotPresent
  tag: "1.0.0"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: competency.asiwdp.example
      paths:
        - path: /api/v1
          pathType: Prefix
  tls:
    - secretName: competency-prod-tls
      hosts:
        - competency.asiwdp.example

tenant:
  isolationEnabled: true
  defaultTenantId: ""
  cacheMaxTenants: 5000
  cacheTtlSeconds: 300

config:
  logLevel: warn
  latencyBudgetMs: 50
  taxonomy:
    versioningEnabled: true
    allowBulkImport: true
    maxBulkRecords: 10000
  audit:
    enabled: true
    retentionDays: 365
  database:
    host: postgres.prod.svc.cluster.local
    port: 5432
    name: competency
    sslMode: verify-full
  redis:
    enabled: true
    host: redis.prod.svc.cluster.local
    port: 6379
    db: 0
