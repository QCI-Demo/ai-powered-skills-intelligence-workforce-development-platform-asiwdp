apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "competency-service.fullname" . }}
  labels:
    {{- include "competency-service.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_BASE_PATH: {{ .Values.config.apiBasePath | quote }}
  LATENCY_BUDGET_MS: {{ .Values.config.latencyBudgetMs | quote }}

  # Tenant configuration
  TENANT_ISOLATION_ENABLED: {{ .Values.tenant.isolationEnabled | quote }}
  TENANT_HEADER_NAME: {{ .Values.tenant.headerName | quote }}
  TENANT_DEFAULT_ID: {{ .Values.tenant.defaultTenantId | quote }}
  TENANT_CACHE_MAX: {{ .Values.tenant.cacheMaxTenants | quote }}
  TENANT_CACHE_TTL_SECONDS: {{ .Values.tenant.cacheTtlSeconds | quote }}

  # Taxonomy / competency domain settings
  TAXONOMY_VERSIONING_ENABLED: {{ .Values.config.taxonomy.versioningEnabled | quote }}
  TAXONOMY_ALLOW_BULK_IMPORT: {{ .Values.config.taxonomy.allowBulkImport | quote }}
  TAXONOMY_MAX_BULK_RECORDS: {{ .Values.config.taxonomy.maxBulkRecords | quote }}

  # Audit logging
  AUDIT_ENABLED: {{ .Values.config.audit.enabled | quote }}
  AUDIT_RETENTION_DAYS: {{ .Values.config.audit.retentionDays | quote }}

  # Database (non-secret)
  DB_HOST: {{ .Values.config.database.host | quote }}
  DB_PORT: {{ .Values.config.database.port | quote }}
  DB_NAME: {{ .Values.config.database.name | quote }}
  DB_SSL_MODE: {{ .Values.config.database.sslMode | quote }}

  # Redis cache (non-secret)
  REDIS_ENABLED: {{ .Values.config.redis.enabled | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
