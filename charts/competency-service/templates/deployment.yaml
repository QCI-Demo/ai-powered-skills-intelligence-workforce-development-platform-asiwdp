apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "competency-service.fullname" . }}
  labels:
    {{- include "competency-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "competency-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "competency-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "competency-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_NAME
              value: competency-service
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: LOG_LEVEL
            - name: API_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: API_BASE_PATH
            - name: LATENCY_BUDGET_MS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: LATENCY_BUDGET_MS
            - name: TENANT_ISOLATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: TENANT_ISOLATION_ENABLED
            - name: TENANT_HEADER_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: TENANT_HEADER_NAME
            - name: TENANT_DEFAULT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: TENANT_DEFAULT_ID
            - name: TENANT_CACHE_MAX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: TENANT_CACHE_MAX
            - name: TENANT_CACHE_TTL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "competency-service.fullname" . }}
                  key: TENANT_CACHE_TTL_SECONDS
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
