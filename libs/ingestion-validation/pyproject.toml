[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asiwdp-ingestion"
version = "0.1.0"
description = "JSON Schema ingestion validation with tenant-scoped HTTP 422 error mapping for ASIWDP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ASIWDP Platform Team" }]
dependencies = [
    "jsonschema>=4.22.0",
    "referencing>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
starlette = [
    "starlette>=0.27.0",
]

[project.urls]
Documentation = "https://github.com/QCI-Demo/ai-powered-skills-intelligence-workforce-development-platform-asiwdp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
