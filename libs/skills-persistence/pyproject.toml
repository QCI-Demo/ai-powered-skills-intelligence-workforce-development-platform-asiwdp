[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asiwdp-skills-persistence"
version = "0.1.0"
description = "PostgreSQL/MongoDB persistence layer for the ASIWDP skills taxonomy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ASIWDP Platform Team" }]
dependencies = [
    "pymongo>=4.6.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mongomock>=4.1.0",
]

[project.urls]
Documentation = "https://github.com/QCI-Demo/ai-powered-skills-intelligence-workforce-development-platform-asiwdp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asiwdp_skills_persistence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
