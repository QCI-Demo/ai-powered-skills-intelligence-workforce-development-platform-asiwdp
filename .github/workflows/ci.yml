# ASIWDP Skills Framework — CI pipeline
# Matrix: unit | integration | performance
# Publishes test reports as artifacts and pushes the competency-service Helm
# chart on successful builds.
#
# Story: Add Helm Chart and CI Pipeline for Skills Service
# Epic: Skills Framework & Competency Management Services

name: CI

on:
  push:
    branches: [main, "tymeline-ae**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  HELM_CHART_PATH: charts/competency-service
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Matrix: unit | integration | performance
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, performance]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Skills API target
        id: target
        run: |
          set -euo pipefail
          LIVE_URL="${{ vars.SKILLS_API_BASE_URL }}"
          if [ -n "${LIVE_URL}" ]; then
            echo "base_url=${LIVE_URL}" >> "$GITHUB_OUTPUT"
            echo "use_stub=false" >> "$GITHUB_OUTPUT"
            echo "newman_folder=" >> "$GITHUB_OUTPUT"
            echo "Using live Skills API: ${LIVE_URL}"
          else
            echo "base_url=http://127.0.0.1:8080/api/v1" >> "$GITHUB_OUTPUT"
            echo "use_stub=true" >> "$GITHUB_OUTPUT"
            # Full collection needs a live Skills service; stub covers Health smoke.
            # Set repo variable SKILLS_API_BASE_URL to run the complete Postman suite.
            echo "newman_folder=01 Health" >> "$GITHUB_OUTPUT"
            echo "Using local Skills API stub"
          fi

      - name: Set up Python
        if: matrix.suite == 'unit' || matrix.suite == 'integration' || matrix.suite == 'performance'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js (Newman)
        if: matrix.suite == 'integration'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install k6
        if: matrix.suite == 'performance'
        env:
          K6_VERSION: "v0.54.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k6.tgz \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo mv "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Prepare reports directory
        run: mkdir -p reports

      # ---- Unit -------------------------------------------------------------
      - name: Install unit-test dependencies
        if: matrix.suite == 'unit'
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/auth-middleware[dev]"
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: |
          pytest libs/auth-middleware/tests \
            -q \
            --junitxml=reports/unit-junit.xml

      # ---- Integration (PyTest + Newman) ------------------------------------
      - name: Install integration-test dependencies
        if: matrix.suite == 'integration'
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          npm install -g newman newman-reporter-htmlextra newman-reporter-junitfull

      - name: Start Skills API stub (CI)
        if: |
          (matrix.suite == 'integration' || matrix.suite == 'performance') &&
          steps.target.outputs.use_stub == 'true'
        run: |
          set -euo pipefail
          python tests/ci/mock_skills_api.py &
          echo $! > /tmp/mock-skills-api.pid
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/health" >/dev/null; then
              echo "Skills API stub is ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "Skills API stub failed to start" >&2
          exit 1

      - name: Run PyTest integration suite
        if: matrix.suite == 'integration'
        working-directory: tests
        run: |
          pytest integration \
            -m integration \
            -q \
            --junitxml=../reports/integration-junit.xml

      - name: Run Postman collection via Newman
        if: matrix.suite == 'integration'
        env:
          POSTMAN_ACCESS_TOKEN: ${{ secrets.SKILLS_API_TOKEN }}
          SKILLS_API_BASE_URL: ${{ steps.target.outputs.base_url }}
          NEWMAN_FOLDER: ${{ steps.target.outputs.newman_folder }}
        run: |
          set -euo pipefail
          TOKEN="${POSTMAN_ACCESS_TOKEN:-ci-synthetic-bearer-token-not-a-secret}"
          FOLDER_ARGS=()
          if [ -n "${NEWMAN_FOLDER}" ]; then
            FOLDER_ARGS+=(--folder "${NEWMAN_FOLDER}")
            echo "Newman folder filter: ${NEWMAN_FOLDER}"
          else
            echo "Newman running full Skills API collection"
          fi
          newman run tests/postman/skills-api-collection.json \
            -e tests/postman/skills-api.environment.json \
            --env-var "baseUrl=${SKILLS_API_BASE_URL}" \
            --env-var "access_token=${TOKEN}" \
            --working-dir tests/postman \
            --delay-request 50 \
            "${FOLDER_ARGS[@]}" \
            -r cli,junitfull,htmlextra \
            --reporter-junitfull-export reports/newman-junit.xml \
            --reporter-htmlextra-export reports/skills-api-newman.html

      # ---- Performance (k6) -------------------------------------------------
      - name: Run k6 skill-lookup load test
        if: matrix.suite == 'performance'
        env:
          TENANT_TOKEN: ${{ secrets.SKILLS_API_TOKEN }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
          USE_STUB: ${{ steps.target.outputs.use_stub }}
          VUS: ${{ vars.K6_VUS }}
          DURATION: ${{ vars.K6_DURATION }}
          QUERY: ${{ vars.SKILLS_LOOKUP_QUERY }}
        run: |
          set -euo pipefail
          export TENANT_TOKEN="${TENANT_TOKEN:-ci-synthetic-bearer-token-not-a-secret}"
          # Stub defaults stay light so p95 < 50ms holds on shared runners;
          # live targets use repo vars or the script defaults (10 VUs / 30s).
          if [ "${USE_STUB}" = "true" ]; then
            export VUS="${VUS:-5}"
            export DURATION="${DURATION:-15s}"
          else
            export VUS="${VUS:-10}"
            export DURATION="${DURATION:-30s}"
          fi
          export QUERY="${QUERY:-category=engineering&limit=50}"
          # k6 exits non-zero when thresholds fail (p95 < 50ms, checks rate == 1)
          k6 run \
            -e TENANT_TOKEN="${TENANT_TOKEN}" \
            -e BASE_URL="${BASE_URL}" \
            -e QUERY="${QUERY}" \
            -e VUS="${VUS}" \
            -e DURATION="${DURATION}" \
            -e JUNIT_OUT=reports/k6-skill-lookup-junit.xml \
            tests/k6/skill-lookup.js

      - name: Stop Skills API stub
        if: always() && (matrix.suite == 'integration' || matrix.suite == 'performance')
        run: |
          if [ -f /tmp/mock-skills-api.pid ]; then
            kill "$(cat /tmp/mock-skills-api.pid)" 2>/dev/null || true
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.suite }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Docker image (versioned tag) — builds when Dockerfile is present
  # ---------------------------------------------------------------------------
  build-image:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: docker
        run: |
          if [ -f Dockerfile ] || [ -f services/skills-framework/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile yet — skipping image push (Helm chart still published)."
          fi

      - name: Set up Docker Buildx
        if: steps.docker.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: steps.docker.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.docker.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/competency-service
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.docker.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Push Helm chart on successful build
  # ---------------------------------------------------------------------------
  helm-publish:
    name: Push Helm chart
    needs: [test, build-image]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.test.result == 'success' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint Helm chart
        run: helm lint "${HELM_CHART_PATH}"

      - name: Package Helm chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(helm show chart "${HELM_CHART_PATH}" | awk '/^version:/ {print $2}')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            APP_VERSION="sha-${GITHUB_SHA::12}"
          fi
          helm package "${HELM_CHART_PATH}" \
            --destination dist \
            --app-version "${APP_VERSION}"
          CHART_TGZ="$(ls dist/*.tgz | head -1)"
          echo "chart_tgz=${CHART_TGZ}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Packaged ${CHART_TGZ} (appVersion=${APP_VERSION})"

      - name: Upload packaged chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-competency-service
          path: dist/*.tgz
          retention-days: 90

      - name: Log in to OCI registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI
        env:
          CHART_REPO: ${{ vars.HELM_OCI_REPO }}
        run: |
          set -euo pipefail
          REPO="${CHART_REPO:-ghcr.io/${{ github.repository_owner }}/charts}"
          helm push "${{ steps.package.outputs.chart_tgz }}" "oci://${REPO}"

  # ---------------------------------------------------------------------------
  # Aggregate status gate (required-check friendly)
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Success
    needs: [test, build-image, helm-publish]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail
          echo "test=${{ needs.test.result }}"
          echo "build-image=${{ needs.build-image.result }}"
          echo "helm-publish=${{ needs.helm-publish.result }}"
          test "${{ needs.test.result }}" = "success"
          for r in "${{ needs.build-image.result }}" "${{ needs.helm-publish.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "Unexpected job result: $r" >&2; exit 1 ;;
            esac
          done
          echo "CI pipeline passed."
