name: ML Models Train Test Register

on:
  push:
    paths:
      - "ml/**"
      - "tests/ml/**"
      - ".github/workflows/ml-models.yml"
  pull_request:
    paths:
      - "ml/**"
      - "tests/ml/**"
      - ".github/workflows/ml-models.yml"
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: "Promote newly registered versions to Production"
        type: boolean
        default: false

env:
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  PYTHONPATH: ml/src:tests/ml

jobs:
  train-test-register:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recommendation
            train_module: asiwdp_ml.recommendation.train
            artifact_dir: artifacts/recommendation
            dockerfile: ml/projects/recommendation/Dockerfile
            image: asiwdp-recommendation
          - name: career_forecast
            train_module: asiwdp_ml.career_forecast.train
            artifact_dir: artifacts/career_forecast
            dockerfile: ml/projects/career_forecast/Dockerfile
            image: asiwdp-career-forecast
          - name: adaptive_sequencing
            train_module: asiwdp_ml.adaptive_sequencing.train
            artifact_dir: artifacts/adaptive_sequencing
            dockerfile: ml/projects/adaptive_sequencing/Dockerfile
            image: asiwdp-adaptive-sequencing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e "ml[dev]"

      - name: Train, evaluate, and register (${{ matrix.name }})
        run: |
          python -m ${{ matrix.train_module }} \
            --artifact-dir ${{ matrix.artifact_dir }} \
            --n-learners 120

      - name: Unit / integration tests
        run: pytest tests/ml -q --tb=short

      - name: Validate artifact metadata
        run: |
          python - <<'PY'
          import json, pathlib, sys
          artifact = pathlib.Path("${{ matrix.artifact_dir }}")
          meta = json.loads((artifact / "metadata.json").read_text())
          required = ["model_name", "model_version", "framework", "trained_at", "metrics"]
          missing = [k for k in required if k not in meta]
          if missing:
              raise SystemExit(f"metadata missing keys: {missing}")
          print("metadata_ok", meta["model_name"], meta["model_version"])
          PY

      - name: Build Docker image
        run: |
          docker build -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.image }}:ci \
            .

      - name: Serve /predict and validate rationale + version metadata
        run: |
          docker run -d --name ${{ matrix.image }} -p 18080:8080 ${{ matrix.image }}:ci
          # Wait for health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health >/tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          python tests/ml/validate_serving_endpoint.py \
            --base-url http://127.0.0.1:18080 \
            --model-kind ${{ matrix.name }}
          docker logs ${{ matrix.image }} || true
          docker rm -f ${{ matrix.image }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-model
          path: ${{ matrix.artifact_dir }}

      - name: Promote to Production (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_production }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('${{ matrix.artifact_dir }}/metadata.json'))['model_version'])")
          python ml/scripts/promote_model.py --model ${{ matrix.name }} --version "$VERSION"

  package-check:
    runs-on: ubuntu-latest
    needs: train-test-register
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify MLproject files exist
        run: |
          test -f ml/projects/recommendation/MLproject
          test -f ml/projects/career_forecast/MLproject
          test -f ml/projects/adaptive_sequencing/MLproject
          test -f ml/projects/recommendation/Dockerfile
          test -f ml/projects/career_forecast/Dockerfile
          test -f ml/projects/adaptive_sequencing/Dockerfile
          echo "MLflow projects and Dockerfiles present"
